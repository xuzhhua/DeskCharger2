[package]
name = "deskcharger2"
version = "2.0.0"
description = "A modern Windows desktop utility: global hotkeys, scheduled reminders, pomodoro, clipboard history, system monitor and quick launcher."
edition = "2021"
rust-version = "1.77"

[lib]
name = "deskcharger2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
arboard = "3"
opener = "0.7"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
